<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b2530">
  <meta name="description" content="MedLearn — medical students uchun raqamli o‘quv platformasi.">
  <title>MedLearn — Medical Learning Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <aside class="sidebar" aria-label="Asosiy navigatsiya">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">M</span>
        <span>Med<span>Learn</span></span>
      </div>
      <nav class="side-nav" id="desktopNav"></nav>
      <div class="sidebar-footer">
        <button class="profile-mini" data-view="profile">
          <span class="avatar">HS</span><span><strong>Husan</strong><small>Medical student</small></span>
        </button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn mobile-menu" id="mobileMenu" aria-label="Menyuni ochish" aria-expanded="false">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="topbar-title" id="topbarTitle">Dashboard</div>
        <div class="topbar-actions">
          <button class="icon-btn" id="themeToggle" aria-label="Mavzuni almashtirish"></button>
          <button class="icon-btn notification-btn" id="notificationBtn" aria-label="Bildirishnomalar">
            <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg>
            <i></i>
          </button>
        </div>
      </header>

      <div class="content" id="viewRoot"></div>
    </main>

    <nav class="bottom-nav" id="bottomNav" aria-label="Mobil navigatsiya"></nav>
  </div>

  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head"><h2 id="modalTitle">Modal</h2><button class="icon-btn" id="modalClose" aria-label="Yopish">×</button></div>
      <div id="modalBody"></div>
    </section>
  </div>
  <div class="toast-stack" id="toastStack" aria-live="polite"></div>
  <script src="js/app.js"></script>
</body>
</html>
